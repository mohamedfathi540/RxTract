[project]
name = "rxtract"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) system for document Q&A"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "aiofiles==23.2.1",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "cohere==5.5.8",
    "docx2txt",
    "fastapi==0.110.2",
    "google-genai",
    "langchain==0.1.20",
    "openai==1.75.0",
    "pgvector==0.4.0",
    "prometheus-client==0.21.1",
    "psycopg2-binary==2.9.10",
    "pymongo>=4.6.1",
    "pydantic-settings>=2.3.0",
    "pymupdf==1.24.3",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "qdrant-client==1.10.1",
    "sqlalchemy==2.0.36",
    "tqdm",
    "uvicorn[standard]==0.29.0",
    "llama-parse",
    "duckduckgo-search",
    "httpx",
    "easyocr",
    "thefuzz[speedup]>=0.22.1",
    "pillow>=12.1.1",
    "opencv-python-headless>=4.11.0.86",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "slowapi>=0.1.9",
    "email-validator>=2.1.0",
    "jellyfish>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

