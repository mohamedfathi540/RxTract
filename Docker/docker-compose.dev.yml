services:
  # PostgreSQL (PGvector) — infrastructure only for dev
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    ports:
      - "5436:5432"
    volumes:
      - /srv/mergerfs/2TB/rxtract_db:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      core: 0

  # Qdrant (Vector DB) — infrastructure only for dev
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6337:6333"
      - "6338:6334"
    volumes:
      - /srv/mergerfs/2TB/rxtract_qdrant:/qdrant/storage
    networks:
      - backend
    restart: unless-stopped
    ulimits:
      core: 0

  # Nginx reverse proxy for hybrid dev (routes to local backend/frontend)
  rxtract_nginx_dev:
    image: nginx:latest
    container_name: rxtract_nginx_dev
    ports:
      - "8899:80"
    volumes:
      - ./Nginx/Default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
