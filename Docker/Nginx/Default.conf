server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # 1. Route API requests to FastAPI
    # Matches /api/v1, /docs, /openapi.json
    location ~ ^/(api/v1|docs|openapi.json) {
        proxy_pass http://rxtract_fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 2. Route everything else to Frontend
    location / {
        proxy_pass http://rxtract_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optionally expose metrics directly 
    location /kfgndfkk4464_fubfd555 {
        proxy_pass http://rxtract_fastapi:8000/kfgndfkk4464_fubfd555;
    }
}