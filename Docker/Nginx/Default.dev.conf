server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Route API and docs to local FastAPI running on host machine.
    location ~ ^/(api/v1|docs|openapi.json) {
        proxy_pass http://host.docker.internal:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Route metrics path to local backend.
    location /kfgndfkk4464_fubfd555 {
        proxy_pass http://host.docker.internal:8001/kfgndfkk4464_fubfd555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route everything else to local Vite frontend running on host machine.
    location / {
        proxy_pass http://host.docker.internal:5777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
