services:
  # FastAPI Application
  rxtract_fastapi:
    build:
      context: ..
      dockerfile: Docker/minirag/Dockerfile
    container_name: rxtract_fastapi
    ports:
      - "8009:8000"
    volumes:
      - rxtract_fastapi_data:/app/Assets
      # Forces downloaded AI models to save on the 2TB drive
      - /srv/mergerfs/2TB/rxtract_hf_cache:/app/cache
    networks:
      - rxtract_backend
    restart: always
    depends_on:
      rxtract_pgvector:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    environment:
      - POSTGRES_HOST=rxtract_pgvector
      - POSTGRES_PORT=5432
      - HF_HOME=/app/cache
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          cpus: '1.0'    # Max 1 CPU core
          memory: 1G     # Max 1GB RAM

  # Frontend Application
  rxtract_frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rxtract_frontend
    ports:
      - "5174:80"
    restart: always
    networks:
      - rxtract_backend

  # Nginx Service
  rxtract_nginx:
    image: nginx:latest
    container_name: rxtract_nginx
    ports:
      - "8899:80"
    volumes:
      - ./Nginx/Default.conf:/etc/nginx/conf.d/Default.conf
    depends_on:
      - rxtract_fastapi
    networks:
      - rxtract_backend
    restart: always

  # PostgreSQL (PGvector)
  rxtract_pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: rxtract_pgvector
    ports:
      - "5436:5432"
    volumes:
      # Moved from Docker volume to the 2TB drive
      - /srv/mergerfs/2TB/rxtract_db:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - rxtract_backend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Max half a CPU core
          memory: 512M   # Max 512MB RAM

  # Qdrant (Vector DB)
  rxtract_qdrant:
    image: qdrant/qdrant:latest
    container_name: rxtract_qdrant
    ports:
      - "6337:6333"
      - "6338:6334"
    volumes:
      # Moved from Docker volume to the 2TB drive
      - /srv/mergerfs/2TB/rxtract_qdrant:/qdrant/storage
    networks:
      - rxtract_backend
    restart: always
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Max half a CPU core
          memory: 512M   # Max 512MB RAM

networks:
  rxtract_backend:
    driver: bridge

volumes:
  rxtract_fastapi_data:
  # rxtract_pgvector_data and rxtract_qdrant_data removed because they are now direct paths on the 2TB drive